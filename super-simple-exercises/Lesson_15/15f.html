<!DOCTYPE html>
<html>
  <head>
    <title>
      15e.html
    </title>
    <style>
      .watch-photo-container{
        position: relative;
        height: 430px;
        width: 350px;
      }

      .watch-photo{
        height: 430px;
        width: 350px;
        object-fit: cover;
      }

      .offer{
        position: absolute;
        background-color: black;
        color: white;

        font-family: Arial;
        padding-left: 10px;
        padding-right: 10px;
        padding-top: 5px;
        padding-bottom: 5px;

        top: 10px;
        right: 0px;
      }

      .add-to-cart-container{
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.7);
        bottom: 0px;
        left: 0px;
        right: 0px;
        height: 120px;
      }

      .add-to-cart-button{
        font-family: Arial;
        background-color: white;
        color: black;
        border: solid;
        border-color: black;
        border-width: 1.5px;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="watch-photo-container">
      <img class="watch-photo" src="Rolex-watch.webp" alt="watch">
      <div class="offer">20% OFF</div>
      <div class="add-to-cart-container">
        <button class="add-to-cart-button">Add to Cart</button>
      </div>
    </div>
  </body>
</html>
